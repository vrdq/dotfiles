
# Font Configuration
font_size 12.0

# Window Configuration
window_padding_width 12
placement_strategy top-left
background_blur 0
hide_window_decorations yes
allow_remote_control yes
dynamic_background_opacity yes

# Custom Neon Green Cursor & Motion Trail Configuration
cursor #76ff03
cursor_text_color #131313
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 10
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled
# Startup command: launches fastfetch + fish if installed, falls back safely to default shell
startup_command sh -c "if command -v fastfetch >/dev/null 2>&1; then fastfetch; fi; if command -v fish >/dev/null 2>&1; then exec fish; else exec \"${SHELL:-bash}\"; fi"
# Dank color generation
include dank-tabs.conf
include dank-theme.conf

# Custom overrides
background #131313
background_opacity 0.85

# Custom Neon Green Cursor & Motion Trail Configuration
cursor #76ff03
cursor_text_color #131313
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 10
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Disable close window confirmation popup
confirm_os_window_close 0

# Copy & Paste Binds (Ctrl+C / Ctrl+V)
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
