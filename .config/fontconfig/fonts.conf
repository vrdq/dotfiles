<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Global JetBrains Mono System-Wide Override with Noto Naskh Arabic Fallback -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrains Mono</string>
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrains Mono</string>
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrains Mono</string>
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrains Mono</string>
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Ensure direct JetBrains Mono queries fall back to Noto Naskh Arabic for Arabic script -->
  <match target="pattern">
    <test qual="any" name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Explicit Arabic language override -->
  <match target="pattern">
    <test qual="any" name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Crisp Rendering, Subpixel Antialiasing & Hinting for JetBrains Mono & Arabic -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
